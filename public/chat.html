<!DOCTYPE html>
<html>
  <head>
    <title>Anon Chat - Chat Room</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .chat-messages {
        margin-bottom: 10px;
      }

      .chat-messages ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      .chat-messages li {
        margin-bottom: 5px;
      }

      .chat-form {
        display: flex;
      }

      .chat-form input[type="text"] {
        flex: 1;
        padding: 5px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      .chat-form button {
        padding: 8px;
        font-size: 16px;
        border-radius: 5px;
        background-color: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Anon Chat - Chat Room</h1>
      <div class="chat-messages">
        <ul id="chatMessages"></ul>
      </div>
      <div class="chat-form">
        <input type="text" id="messageInput" />
        <button id="sendMessageButton">Send</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>


    <script>
      const chatMessages = document.getElementById("chatMessages");
      const messageInput = document.getElementById("messageInput");
      const sendMessageButton = document.getElementById("sendMessageButton");

      const socket = io();

      // Retrieve the username from the query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const username = urlParams.get("username");

      // Function to display a message in the chat room
      function displayMessage(sender, message) {
        const li = document.createElement("li");
        li.textContent = `${sender}: ${message}`;
        chatMessages.appendChild(li);
      }

      // Event handling for 'chat-history' event
      socket.on("chat-history", chatHistory => {
        chatMessages.innerHTML = ""; // Clear existing messages

        // Display chat history
        chatHistory.forEach(({ senderId, message }) => {
          displayMessage(senderId, message);
        });
      });

      // Event handling for 'message' event
      socket.on("message", ({ senderId, message }) => {
        displayMessage(senderId, message);
      });

      // Event handling for 'connect' event
      socket.on("connect", () => {
        // Emit 'join-room' event with the username as the room (chat link)
        socket.emit("join-room", username);
      });

      // Event handling for 'disconnect' event
      socket.on("disconnect", () => {
        chatMessages.innerHTML = ""; // Clear chat messages on disconnect
      });

      // Event handling for 'connect_error' event
      socket.on("connect_error", error => {
        console.error("WebSocket connection error:", error);
      });

      // Event handling for sending a message
      sendMessageButton.addEventListener("click", () => {
        const message = messageInput.value.trim();

        if (message) {
          // Emit 'message' event with the message
          socket.emit("message", { message });
          messageInput.value = ""; // Clear the input field
        }
      });
    </script>
  </body>
</html>
